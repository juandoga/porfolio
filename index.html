<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juan Domenech — Fotografía</title>
<meta name="description" content="Fotografía de calle en blanco y negro y en color.">
<meta name="theme-color" content="#f3f2ee">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Juan Domenech">
<meta property="og:title" content="Juan Domenech — Fotografía">
<meta property="og:description" content="Fotografía de calle en blanco y negro y en color.">
<meta property="og:url" content="https://juandoga.github.io/porfolio/">
<meta property="og:image" content="https://juandoga.github.io/porfolio/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="es_ES">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Juan Domenech — Fotografía">
<meta name="twitter:description" content="Fotografía de calle en blanco y negro y en color.">
<meta name="twitter:image" content="https://juandoga.github.io/porfolio/og.jpg">
<link rel="preload" href="fonts/archivo-black-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:"Archivo Black";src:url(fonts/archivo-black-latin-400-normal.woff2) format("woff2");font-display:swap}
  @font-face{font-family:"Archivo";src:url(fonts/archivo-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"Archivo";src:url(fonts/archivo-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}

  :root{--bg:#f3f2ee;--ink:#1b1b1a;--mute:#8d8b85;--pad:clamp(20px,3.2vw,48px);
        --display:"Archivo Black","Arial Black",Impact,sans-serif;--sans:"Archivo",system-ui,-apple-system,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg);color:var(--ink);scroll-behavior:smooth}
  body{font-family:var(--sans);font-weight:500;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{display:block;user-select:none;-webkit-user-drag:none}
  button{all:unset;cursor:pointer}

  /* Cabecera: nombre a la izquierda, series a la derecha. No flota sobre las fotos. */
  header{display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:var(--pad);flex-wrap:wrap}
  .name{font-family:var(--display);font-size:clamp(22px,2.4vw,32px);line-height:1;letter-spacing:-.02em;text-transform:uppercase}
  nav{display:flex;gap:clamp(14px,2vw,28px);flex-wrap:wrap}
  nav a{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
  nav a:hover,nav a.on{color:var(--ink)}

  /* Columna de fotos: grandes, una debajo de otra, con aire entre ellas */
  .feed{display:flex;flex-direction:column;align-items:center;gap:clamp(64px,14vh,160px);padding:clamp(24px,6vh,72px) var(--pad) 0}
  .feed figure{width:100%;display:flex;flex-direction:column;align-items:center}
  .feed img{max-width:min(100%,1400px);max-height:86vh;width:auto;height:auto;object-fit:contain;cursor:zoom-in;background:#e7e5df}
  .feed figcaption{margin-top:12px;color:var(--mute);font-size:12px;text-align:center}
  .feed figcaption a:hover{color:var(--ink)}

  .intro{padding:clamp(24px,8vh,96px) var(--pad) 0;text-align:center}
  .intro h1{font-family:var(--display);font-size:clamp(36px,6vw,84px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
  .intro p{max-width:46ch;margin:18px auto 0;font-size:15px;color:var(--mute)}

  .next{padding:clamp(80px,16vh,180px) var(--pad) 0;text-align:center}
  .next a{font-family:var(--display);font-size:clamp(28px,4vw,52px);text-transform:uppercase;letter-spacing:-.02em}
  .next a:hover{color:var(--mute)}
  .next span{display:block;color:var(--mute);margin-bottom:6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}

  footer{display:flex;justify-content:space-between;padding:clamp(80px,14vh,160px) var(--pad) var(--pad);color:var(--mute);font-size:12px}

  .info{max-width:620px;margin:0 auto;padding:clamp(40px,12vh,140px) var(--pad) 0}
  .info p{font-size:clamp(18px,1.8vw,22px);line-height:1.5;margin-bottom:1em}
  .info dl{margin-top:48px;display:grid;grid-template-columns:110px 1fr;gap:10px 16px;font-size:14px}
  .info dt{color:var(--mute)}
  .info dd a{border-bottom:1px solid currentColor}

  /* Visor a pantalla completa */
  .lb{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;grid-template-rows:auto 1fr auto}
  .lb.on{display:grid}
  .lb-top,.lb-bot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:18px var(--pad);font-size:12px}
  .lb-top em{font-family:var(--display);font-style:normal;text-transform:uppercase;font-size:14px}
  .lb-stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 var(--pad)}
  .lb-stage img{max-width:100%;max-height:100%;object-fit:contain}
  .lb .hit{position:absolute;top:0;bottom:0;width:50%;z-index:2}
  .lb .hit.prev{left:0;cursor:w-resize}.lb .hit.next{right:0;cursor:e-resize}
  .lb button{color:var(--mute)} .lb button:hover{color:var(--ink)}
  .lb .ctl{display:flex;gap:20px}
  .lb .count{font-variant-numeric:tabular-nums}

  @media (max-width:640px){
    header{flex-direction:column;align-items:flex-start;gap:14px}
    .feed{gap:56px;padding-left:0;padding-right:0}
    .feed img{max-height:none;width:100%}
    .feed figcaption{padding:0 var(--pad)}
  }
</style>
</head>
<body>
<header>
  <a class="name" href="#" id="site-name"></a>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<footer><span id="foot-name"></span><span id="foot-year"></span></footer>

<div class="lb" id="lb" aria-modal="true" role="dialog">
  <div class="lb-top"><em id="lb-title"></em><button id="lb-close">Cerrar</button></div>
  <div class="lb-stage">
    <img id="lb-img" alt="">
    <a class="hit prev" id="lb-prev" aria-label="Anterior"></a>
    <a class="hit next" id="lb-next" aria-label="Siguiente"></a>
  </div>
  <div class="lb-bot"><span id="lb-cap" style="color:var(--mute)"></span>
    <div class="ctl"><button id="b-prev">Anterior</button><span class="count" id="lb-count"></span><button id="b-next">Siguiente</button><button id="b-share">Compartir</button></div>
  </div>
</div>

<script src="data.js"></script>
<script>
(() => {
  const S = window.SITE, $ = id => document.getElementById(id);
  const byId = Object.fromEntries(S.series.map(s => [s.id, s]));
  const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const fecha = iso => { if (!iso) return ""; const [y,m,d] = iso.split("-").map(Number); return d + " de " + MESES[m-1] + " de " + y; };
  const pie = it => [it.place, fecha(it.date)].filter(Boolean).join(", ");
  const seriesOf = file => S.series.find(s => s.items.some(i => i.file === file));

  $("site-name").textContent = S.name;
  $("foot-name").textContent = S.name;
  $("foot-year").textContent = "© " + new Date().getFullYear();
  $("nav").innerHTML = S.series.map(s => `<a href="#${s.id}" data-id="${s.id}">${s.title}</a>`).join("") + `<a href="#info" data-id="info">Info</a>`;

  const img = (it, i, list) =>
    `<img src="m/${it.src}" srcset="m/${it.src} 1200w, img/${it.src} 2000w" sizes="(max-width:640px) 100vw, 1400px"
      width="${it.w}" height="${it.h}" loading="${i < 2 ? "eager" : "lazy"}" decoding="async" alt="" data-list="${list}" data-i="${i}">`;

  let current = null; // lista que se muestra en la página: "home" o id de serie

  function home() {
    current = "home";
    $("main").innerHTML = `<section class="feed">${S.selection.map((it, i) => {
      const s = seriesOf(it.file);
      const cap = s ? `<a href="#${s.id}">${s.title}</a> · ${pie(it)}` : pie(it);
      return `<figure>${img(it, i, "home")}<figcaption>${cap}</figcaption></figure>`;
    }).join("")}</section>`;
  }

  function series(s) {
    current = s.id;
    const k = S.series.indexOf(s), nx = S.series[(k + 1) % S.series.length];
    $("main").innerHTML = `<section class="intro"><h1>${s.title}</h1><p>${s.intro}</p></section>
      <section class="feed">${s.items.map((it, i) => `<figure>${img(it, i, s.id)}<figcaption>${pie(it)}</figcaption></figure>`).join("")}</section>
      <section class="next"><span>Siguiente serie</span><a href="#${nx.id}">${nx.title}</a></section>`;
  }

  function info() {
    current = "info";
    const c = S.contact || {}, rows = [];
    if (c.email) rows.push(["Correo", `<a href="mailto:${c.email}">${c.email}</a>`]);
    if (c.instagram) rows.push(["Instagram", `<a href="https://instagram.com/${c.instagram}" target="_blank" rel="noopener">@${c.instagram}</a>`]);
    if (c.linkedin) rows.push(["LinkedIn", `<a href="${c.linkedin}" target="_blank" rel="noopener">Perfil</a>`]);
    $("main").innerHTML = `<section class="info">
      ${(S.about || []).map(p => `<p>${p}</p>`).join("")}
      <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></section>`;
  }

  // Visor
  let lbList = [], lbIdx = 0, lbKey = "";
  const listFor = key => key === "home" ? S.selection : byId[key].items;
  function openLb(key, i) {
    lbKey = key; lbList = listFor(key); lbIdx = i;
    const it = lbList[i], s = key === "home" ? seriesOf(it.file) : byId[key];
    $("lb-img").src = "img/" + it.src;
    $("lb-title").textContent = key === "home" ? "Selección" : s.title;
    $("lb-cap").textContent = (key === "home" && s ? s.title + " · " : "") + pie(it);
    $("lb-count").textContent = (i + 1) + " / " + lbList.length;
    $("lb").classList.add("on"); document.body.style.overflow = "hidden";
    [i + 1, i - 1].forEach(j => { const n = lbList[(j + lbList.length) % lbList.length]; new Image().src = "img/" + n.src; });
  }
  function closeLb() { $("lb").classList.remove("on"); document.body.style.overflow = ""; }
  const step = d => openLb(lbKey, (lbIdx + d + lbList.length) % lbList.length);
  $("main").addEventListener("click", e => { const t = e.target.closest("img[data-list]"); if (t) openLb(t.dataset.list, +t.dataset.i); });
  $("lb-prev").onclick = $("b-prev").onclick = () => step(-1);
  $("lb-next").onclick = $("b-next").onclick = () => step(1);
  $("lb-close").onclick = closeLb;
  addEventListener("keydown", e => {
    if (!$("lb").classList.contains("on")) return;
    if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "Escape") closeLb();
  });
  let x0 = null;
  $("lb").addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
  $("lb").addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 45) step(dx < 0 ? 1 : -1); });
  // Compartir: en el móvil abre el menú del sistema; en ordenador copia el enlace a la serie
  $("b-share").onclick = async () => {
    const base = location.href.split("#")[0], url = lbKey === "home" ? base : base + "#" + lbKey;
    try { if (navigator.share) { await navigator.share({ title: S.name, url }); return; } } catch (e) { return; }
    try { await navigator.clipboard.writeText(url); $("b-share").textContent = "Enlace copiado"; } catch (e) { $("b-share").textContent = url; }
    setTimeout(() => $("b-share").textContent = "Compartir", 2500);
  };

  function route() {
    closeLb();
    const h = decodeURIComponent(location.hash.slice(1)).replace(/-\d+$/, "");
    if (byId[h]) { series(byId[h]); document.title = byId[h].title + " — " + S.name; }
    else if (h === "info") { info(); document.title = "Info — " + S.name; }
    else { home(); document.title = S.name + " — Fotografía"; }
    document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.id === h));
    scrollTo(0, 0);
  }
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
