<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juan Domenech — Fotografía</title>
<meta name="description" content="Fotografía de calle en blanco y negro y en color.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Juan Domenech">
<meta property="og:title" content="Juan Domenech — Fotografía">
<meta property="og:description" content="Fotografía de calle en blanco y negro y en color.">
<meta property="og:url" content="https://juandoga.github.io/porfolio/">
<meta property="og:image" content="https://juandoga.github.io/porfolio/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="es_ES">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Juan Domenech — Fotografía">
<meta name="twitter:description" content="Fotografía de calle en blanco y negro y en color.">
<meta name="twitter:image" content="https://juandoga.github.io/porfolio/og.jpg">
<link rel="preload" href="fonts/archivo-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:"Archivo";src:url(fonts/archivo-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Archivo";src:url(fonts/archivo-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
  :root{--bg:#fff;--ink:#111;--mute:#8a8a8a;--pad:clamp(20px,3.4vw,48px);--gap:6px}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg);color:var(--ink)}
  body{font-family:"Archivo",system-ui,-apple-system,Helvetica,Arial,sans-serif;font-weight:400;font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
  a{color:inherit;text-decoration:none}
  img{display:block;user-select:none;-webkit-user-drag:none}
  button{all:unset;cursor:pointer}

  header{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:calc(var(--pad)*.8) var(--pad)}
  .name{font-size:17px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
  nav{display:flex;gap:clamp(16px,2.4vw,34px)}
  nav a{font-size:13px;letter-spacing:.04em;opacity:.65}
  nav a:hover,nav a.on{opacity:1}
  #burger{display:none;width:26px;height:14px;border-top:1px solid currentColor;border-bottom:1px solid currentColor}
  body.hero header{color:#fff}
  main{padding-top:calc(var(--pad)*1.6 + 30px)}
  body.hero main{padding:0}

  /* Portada: una foto a pantalla completa que cambia sola */
  .hero-wrap{position:relative;height:100vh;height:100dvh;overflow:hidden;background:#111}
  .hero-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease}
  .hero-wrap img.on{opacity:1}
  .hero-wrap::after{content:"";position:absolute;inset:0 0 auto 0;height:160px;background:linear-gradient(rgba(0,0,0,.35),transparent);pointer-events:none}

  /* Galería en columnas, sin pies de foto */
  .grid{display:flex;gap:var(--gap);padding:0 var(--gap) var(--gap)}
  .grid .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--gap)}
  .grid img{width:100%;height:auto;background:#f1f1f1;cursor:zoom-in;transition:opacity .25s}
  .grid img:hover{opacity:.86}

  .info{max-width:640px;margin:0 auto;padding:clamp(24px,9vh,110px) var(--pad) 80px}
  .info p{font-size:clamp(15px,1.4vw,17px);line-height:1.7;margin-bottom:1.1em}
  .info p+dl{margin-top:44px}
  .info dl{display:grid;grid-template-columns:110px 1fr;gap:8px 16px;font-size:14px}
  .info dt{color:var(--mute)}
  .info dd a{border-bottom:1px solid currentColor}

  footer{display:flex;justify-content:space-between;align-items:center;padding:28px var(--pad);color:var(--mute);font-size:12px}
  body.hero footer{display:none}
  footer .ig{display:block;width:20px;height:20px;color:var(--ink)}

  #lb{position:fixed;inset:0;z-index:20;background:#fff;display:none;align-items:center;justify-content:center}
  #lb.on{display:flex}
  #lb img{max-width:calc(100vw - 2*var(--pad));max-height:calc(100dvh - 110px);object-fit:contain}
  #lb .hit{position:absolute;top:60px;bottom:50px;width:50%}
  #lb .prev{left:0;cursor:w-resize}#lb .next{right:0;cursor:e-resize}
  #lb .x{position:absolute;top:18px;right:var(--pad);font-size:13px;letter-spacing:.04em;padding:8px 0;z-index:2}
  #lb .n{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}

  @media (max-width:700px){
    #burger{display:block}
    nav{display:none;position:fixed;inset:0;z-index:6;background:#fff;color:#111;flex-direction:column;align-items:center;justify-content:center;gap:28px}
    nav a{font-size:20px;opacity:1}
    body.menu nav{display:flex}
    body.menu #burger{position:relative;z-index:7;color:#111}
    #lb img{max-width:100vw}
  }
</style>
</head>
<body>
<header>
  <a class="name" href="#" id="site-name"></a>
  <nav id="nav"></nav>
  <button id="burger" aria-label="Menú"></button>
</header>
<main id="main"></main>
<footer><span id="foot"></span><span id="ig"></span></footer>
<div id="lb"><button class="x" id="lb-x">Cerrar</button><a class="hit prev" id="lb-p"></a><a class="hit next" id="lb-n"></a><img id="lb-img" alt=""><div class="n" id="lb-c"></div></div>

<script src="data.js"></script>
<script>
(() => {
  const S = window.SITE, $ = id => document.getElementById(id);
  const byId = Object.fromEntries(S.series.map(s => [s.id, s]));
  const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const DELAY = 6000;
  const big = () => innerWidth * (devicePixelRatio || 1) > 1300;

  $("site-name").textContent = S.name;
  $("foot").textContent = S.name + " © " + new Date().getFullYear();
  $("nav").innerHTML = S.series.filter(s => s.items.length).map(s => `<a href="#${esc(s.id)}" data-id="${esc(s.id)}">${esc(s.title)}</a>`).join("") + `<a href="#info" data-id="info">Info</a>`;
  const ig = (S.contact || {}).instagram;
  if (ig) $("ig").innerHTML = `<a class="ig" href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="20" height="20"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.3"/><circle cx="17.6" cy="6.4" r="1" fill="currentColor" stroke="none"/></svg></a>`;
  $("burger").onclick = () => document.body.classList.toggle("menu");

  let timer = null, list = [], idx = 0;

  function home() {
    document.body.classList.add("hero");
    const items = S.selection.length ? S.selection : S.series.flatMap(s => s.items).slice(0, 5);
    $("main").innerHTML = `<div class="hero-wrap">${items.map((it, i) => `<img ${i ? "data-" : ""}src="${big() ? "img/" : "m/"}${esc(it.src)}" alt="" class="${i ? "" : "on"}">`).join("")}</div>`;
    const ims = [...$("main").querySelectorAll("img")]; let k = 0;
    if (ims.length > 1) timer = setInterval(() => {
      ims[k].classList.remove("on"); k = (k + 1) % ims.length;
      if (ims[k].dataset.src) { ims[k].src = ims[k].dataset.src; delete ims[k].dataset.src; }
      ims[k].classList.add("on");
      const nx = ims[(k + 1) % ims.length]; if (nx.dataset.src) { nx.src = nx.dataset.src; delete nx.dataset.src; }
    }, DELAY);
  }

  function gallery(s) {
    list = s.items;
    const n = innerWidth < 700 ? 2 : innerWidth < 1500 ? 3 : 4;
    const cols = Array.from({ length: n }, () => ({ h: 0, html: "" }));
    s.items.forEach((it, i) => {
      const c = cols.reduce((a, b) => (b.h < a.h ? b : a));
      c.h += it.h / it.w;
      c.html += `<img src="${n > 2 || big() ? "m/" : "thumb/"}${esc(it.src)}" width="${it.w}" height="${it.h}" loading="${i < 8 ? "eager" : "lazy"}" alt="" data-i="${i}">`;
    });
    $("main").innerHTML = `<section class="grid">${cols.map(c => `<div class="col">${c.html}</div>`).join("")}</section>`;
    $("main").querySelectorAll("img").forEach(im => im.onclick = () => openLb(+im.dataset.i));
  }

  function info() {
    const c = S.contact || {}, rows = [];
    if (c.email) rows.push(["Correo", `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`]);
    if (c.instagram) rows.push(["Instagram", `<a href="https://instagram.com/${esc(c.instagram)}" target="_blank" rel="noopener">@${esc(c.instagram)}</a>`]);
    if (c.linkedin) rows.push(["LinkedIn", `<a href="${esc(c.linkedin)}" target="_blank" rel="noopener">Perfil</a>`]);
    $("main").innerHTML = `<section class="info">${(S.about || []).map(p => `<p>${esc(p)}</p>`).join("")}<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></section>`;
  }

  function openLb(i) { idx = (i + list.length) % list.length; $("lb-img").src = (big() ? "img/" : "m/") + list[idx].src; $("lb-c").textContent = (idx + 1) + " / " + list.length; $("lb").classList.add("on"); new Image().src = (big() ? "img/" : "m/") + list[(idx + 1) % list.length].src; }
  const closeLb = () => $("lb").classList.remove("on");
  $("lb-x").onclick = closeLb; $("lb-p").onclick = () => openLb(idx - 1); $("lb-n").onclick = () => openLb(idx + 1);
  addEventListener("keydown", e => { if (!$("lb").classList.contains("on")) return; if (e.key === "Escape") closeLb(); if (e.key === "ArrowRight") openLb(idx + 1); if (e.key === "ArrowLeft") openLb(idx - 1); });
  let x0 = null;
  $("lb").addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
  $("lb").addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) openLb(idx + (dx < 0 ? 1 : -1)); }, { passive: true });

  let lastW = innerWidth;
  function route() {
    clearInterval(timer); closeLb(); document.body.classList.remove("hero", "menu");
    const h = decodeURIComponent(location.hash.slice(1));
    if (byId[h]) { gallery(byId[h]); document.title = byId[h].title + " — " + S.name; }
    else if (h === "info") { info(); document.title = "Info — " + S.name; }
    else { home(); document.title = S.name + " — Fotografía"; }
    document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.id === h));
    scrollTo(0, 0);
  }
  addEventListener("hashchange", route);
  addEventListener("resize", () => { if (Math.abs(innerWidth - lastW) > 80) { lastW = innerWidth; if (byId[location.hash.slice(1)]) route(); } });
  route();
})();
</script>
</body>
</html>
